<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snackr — Food Delivery Platform</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fffaf3;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .wrap {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      width: 320px;
    }
    h1 { color: #e67e22; margin-bottom: 10px; }
    a {
      display: block;
      background: #e67e22;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { background: #d35400; }
    small { display: block; margin-top: 10px; color: #999; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Snackr 🍔</h1>
    <p>Choose your role:</p>
    <a href="/user">User Login / Register</a>
    <a href="/restaurant">Restaurant Login / Register</a>
    <a href="/delivery">Delivery Partner Login / Register</a>
    <small>India’s simplest food delivery network</small>
  </div>
</body>
</html>
