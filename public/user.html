<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Login – Snackr</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff7e6; display:flex;justify-content:center;align-items:center;height:100vh; }
    .box { background:#fff;padding:30px;border-radius:10px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,0.1);width:300px; }
    input,button{width:90%;padding:10px;margin:8px 0;border-radius:5px;border:1px solid #ccc;}
    button{background:#ff6600;color:white;border:none;cursor:pointer;}
    button:hover{background:#e65c00;}
  </style>
</head>
<body>
  <div class="box">
    <h2>👤 Snackr User</h2>
    <form action="/login/user" method="POST">
      <input type="email" name="email" placeholder="Email" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit">Login</button>
    </form>
    <hr>
    <form action="/register/user" method="POST">
      <input type="email" name="email" placeholder="Email" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit">Register</button>
    </form>
    <p><a href="/">⬅ Back to main</a></p>
  </div>
</body>
</html>
