<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery Partner Login – Snackr</title>
  <style>
    body{font-family:Arial,sans-serif;background:#e6f0ff;display:flex;justify-content:center;align-items:center;height:100vh;}
    .box{background:#fff;padding:30px;border-radius:10px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,0.1);width:300px;}
    input,select,button{width:90%;padding:10px;margin:8px 0;border-radius:5px;border:1px solid #ccc;}
    button{background:#0066ff;color:white;border:none;cursor:pointer;}
    button:hover{background:#004de6;}
  </style>
</head>
<body>
  <div class="box">
    <h2>🚚 Delivery Partner</h2>
    <form action="/login/delivery" method="POST">
      <input type="email" name="email" placeholder="Email" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit">Login</button>
    </form>
    <hr>
    <h3>Register</h3>
    <form action="/register/delivery" method="POST">
      <input type="text" name="name" placeholder="Full Name" required><br>
      <input type="email" name="email" placeholder="Email" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <input type="text" name="vehicleNo" placeholder="Vehicle Number" required><br>
      <select name="partnerType" required>
        <option value="">Select Type</option>
        <option value="Home">🏠 Home Delivery Partner</option>
        <option value="Side-by-Side">🍽️ Side-by-Side Partner</option>
      </select><br>
      <button type="submit">Register</button>
    </form>
    <p><a href="/">⬅ Back to main</a></p>
  </div>
</body>
</html>
